<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="author" content="Claude Fable 5.2 (claude-fable-5-2)">
<title>Agentic systems — briefing</title>
<style>
:root{--space:#03090f;--ink:#e1edf5;--muted:#93a6b4;--teal:#27ddc8;--rose:#f58eab;--amber:#e9bd79;--violet:#a99cff;--line:#2a4350}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--space);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:grid;grid-template-rows:auto 1fr auto;min-height:100dvh;background:radial-gradient(ellipse at 68% 46%,#0b1a25 0,transparent 60%),var(--space);overflow:hidden}
button{font:inherit;color:inherit;background:transparent;border:1px solid transparent;border-radius:6px;cursor:pointer}
button:hover{background:#172932}
button:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 4vw 0;color:#b9ccd8;font-size:15px}
.brand{display:flex;align-items:center;gap:12px}
.brand i{width:22px;height:20px;border:1px solid var(--teal);border-radius:46% 52% 49% 43%;position:relative}
.brand i:after{content:"";position:absolute;left:8px;top:7px;width:4px;height:4px;border-radius:50%;background:var(--ink)}
header button{font-size:22px;width:38px;height:38px;color:#718995}
main{display:grid;grid-template-columns:minmax(280px,34%) 1fr;align-items:center;gap:1vw;padding:0 2vw 0 5vw;min-height:0}
.copy{transition:opacity .25s}
.copy.swap{opacity:0}
.chapter{color:var(--teal);font-size:14px;letter-spacing:.03em;margin:0 0 22px;display:flex;gap:12px;align-items:center}
.chapter:before{content:"";width:26px;border-top:1px solid var(--teal)}
h1{font:400 clamp(30px,3.7vw,58px)/1.08 Georgia,"Times New Roman",serif;letter-spacing:-.03em;margin:0 0 26px;text-wrap:balance}
.copy p.body{font-size:clamp(16px,1.5vw,23px);line-height:1.55;color:var(--muted);margin:0;max-width:30ch;text-wrap:pretty}
svg{width:100%;height:100%;max-height:calc(100dvh - 150px);overflow:visible}
footer{display:flex;align-items:center;gap:20px;padding:10px 4vw 16px;font-size:13px;color:#7d95a3}
.transport button{font-size:22px;width:40px;height:40px}
nav{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
nav button{padding:6px 12px 8px;color:#7d95a3;text-align:left}
nav button[aria-current=true]{color:var(--ink)}
nav .dots{display:flex;gap:4px;margin-top:6px}
nav .dots i{width:16px;height:2px;background:#2a4350;border-radius:2px}
nav .dots i.done{background:#3d7f80}
nav .dots i.now{background:var(--teal)}
.credit{white-space:nowrap;color:#5f7886}
nav button{font-size:12.5px}
@media (max-width:860px){body{overflow:auto}main{grid-template-columns:1fr;padding:12px 16px}svg{max-height:60dvh}footer{flex-wrap:wrap;padding:10px 16px}nav button span{display:none}.credit{width:100%;text-align:center}}

/* diagram */
text{fill:#c9dbe6;font-size:24px;font-family:inherit}
.scene,.layer{opacity:0;transition:opacity .6s;pointer-events:none}
.scene.show,.layer.show{opacity:1}
.membrane{fill:url(#interior);stroke:var(--teal);stroke-width:1.6;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.6s ease,stroke-width .5s,filter .5s}
.show .membrane{stroke-dashoffset:0}
.ctx .membrane{stroke-width:4;filter:drop-shadow(0 0 10px #27ddc8aa)}
.breathe{animation:breathe 9s ease-in-out infinite;transform-origin:500px 400px}
@keyframes breathe{50%{transform:scale(1.012) rotate(.6deg)}}
.edge{stroke:var(--line);stroke-width:1.2;transition:opacity .6s,stroke .4s}
.node circle.core{fill:#7f9bab;transition:fill .3s,r .3s}
.node circle.halo{fill:#bfe9ff;opacity:0;transition:opacity .3s}
.node.hub circle.core{fill:#b9d2df}
.node.on circle.core{fill:#f2fbff}
.node.on circle.halo{opacity:.28}
.node.bad circle.core{fill:var(--rose)}.node.bad circle.halo{fill:var(--rose);opacity:.35}
.node.good circle.core{fill:var(--teal)}.node.good circle.halo{fill:var(--teal);opacity:.35}
.node.trace circle.core{fill:var(--amber)}.node.trace circle.halo{fill:var(--amber);opacity:.35}
.node,.lbl{transition:opacity .7s,transform .7s}
.gone{opacity:0!important}
.off{opacity:.22!important}
.amber .node circle.core{fill:var(--amber)}.amber .edge{stroke:#6b5a3c}.amber text{fill:var(--amber)}
#dirLabel{font-size:27px;fill:#fff}
.ctxlabel{font-size:19px;fill:var(--teal);letter-spacing:.04em}
.small{font-size:19px;fill:#8ea5b3}
.cfile{transition:opacity .5s,transform .5s}
.cfile path.pg{fill:#0b2226;stroke:var(--teal);stroke-width:.55}
.cfile path.ln{fill:none;stroke:var(--teal);stroke-width:.45;opacity:.75}
.cfile.lesson{opacity:0}.learned .cfile.lesson{opacity:1}
.cfile.archf{opacity:0;transform-box:fill-box}.tuned .cfile.archf{opacity:1}.tuned .cfile.old{opacity:0}
.cfile.lesson path.pg,.cfile.archf path.pg{stroke:var(--amber);fill:#2b2416}.cfile.lesson path.ln,.cfile.archf path.ln{stroke:var(--amber)}
.cstack{transition:filter .3s}.cstack.flash{filter:drop-shadow(0 0 9px var(--amber))}.cstack.read{filter:drop-shadow(0 0 9px var(--teal))}
.file path{fill:#0c1c26;stroke:#9fc3d6;stroke-width:1}
.file{animation:pop .7s cubic-bezier(.2,.8,.2,1) both}
.file path{animation:ink 1.3s ease-out both}
.file.flash path{stroke:var(--amber);fill:#3a2f1c}
.file.lesson path{stroke:var(--amber)}
@keyframes pop{0%{opacity:0;transform:scale(5)}35%{opacity:1;transform:scale(3.2)}100%{transform:scale(1)}}
@keyframes ink{0%,45%{stroke:#fff;fill:#2b5266}}
.tool rect{fill:#0c1c26;stroke:#b9d2df;stroke-width:1.4}
.sweep{stroke:var(--amber);stroke-width:2;opacity:.7}
.person circle,.person path{fill:none;stroke:#c9dbe6;stroke-width:1.6}
.today .agent{fill:#9fc3d6}
.today .ping{fill:#f2fbff;animation:ping 2.4s ease-in-out infinite}
@keyframes ping{0%,100%{transform:translateX(0)}50%{transform:translateX(34px)}}
/* exchange */
.logbox{fill:#07141c;stroke:#22404d;stroke-width:1.2}
.row{transition:transform .65s cubic-bezier(.4,0,.2,1),opacity .5s}
.row rect{fill:#5d7482;transition:fill .5s,stroke .3s;stroke:transparent;stroke-width:2}
.row.hl rect{stroke:#fff}
.row .bar{fill:#03090f;opacity:.35}
.c-us{--c:var(--teal)}.c-ds{--c:var(--rose)}.c-ot{--c:var(--violet)}.c-pp{--c:var(--amber)}
.row.colored rect{fill:var(--c)}
.mini .mem{fill:url(#interior);stroke:var(--c);stroke-width:1.6;transition:stroke-width .4s,filter .4s}
.mini.wake .mem{stroke-width:3.5;filter:drop-shadow(0 0 9px var(--c))}
.mini .d{fill:#9fb8c6;transition:fill .25s}.mini .d.lit{fill:#f2fbff;filter:drop-shadow(0 0 5px #bfe9ff)}.mini .l{stroke:var(--line)}
.mini .core{fill:#f2fbff}
.mini text{font-size:22px}
.mini .state{font-size:18px;opacity:0;transition:opacity .4s}
.mini[data-state=waiting] .state.w{opacity:1;fill:var(--amber)}
.mini[data-state=working] .state.k{opacity:1;fill:var(--teal)}
.mini .d0{transition:r .4s}
.mini[data-state=waiting] .d0{fill:var(--amber);r:9px;filter:drop-shadow(0 0 6px var(--amber))}
.mini[data-state=working] .d0{r:6px}
.waitfx{opacity:0;transition:opacity .4s}.mini[data-state=waiting] .waitfx{opacity:1}
.waitfx .ring{fill:none;stroke:var(--amber);stroke-width:1.6;transform-box:fill-box;transform-origin:center;animation:ripple 1.8s ease-out infinite}
.waitfx rect{fill:#2b2416;stroke:var(--amber);stroke-width:1.2}
.waitfx .td{fill:var(--amber);animation:think 1.2s infinite}
@keyframes ripple{from{transform:scale(1);opacity:.9}to{transform:scale(2.6);opacity:0}}
@keyframes think{0%,60%,100%{opacity:.25}30%{opacity:1}}
.mini[data-state=working] .d0{fill:var(--teal)}
@keyframes blink{50%{opacity:.25}}
.mini .ghostperson{opacity:0;transition:opacity .5s}
.mini.ghost .mem{stroke-dasharray:5 7;fill:none;opacity:.6}
.mini.ghost .d,.mini.ghost .l,.mini.ghost .core{opacity:0}
.mini.ghost .ghostperson{opacity:1}
.bubble{opacity:0;transition:opacity .3s}
.bubble.show{opacity:1}
.bubble rect{fill:#0c1c26;stroke:var(--c);stroke-width:1.2}
.bubble text{font-size:17px;fill:#fff}
.spine{fill:none;stroke:url(#spineFade);stroke-width:2}
.spine.glowline{stroke-width:8;opacity:.4;filter:url(#glow)}
#orgWorld{transform-origin:0 0}
.ocell{transition:opacity .8s}
.ocell .mem{fill:url(#interior);stroke:var(--c);stroke-width:1.5;vector-effect:non-scaling-stroke;transition:stroke-width .4s,stroke .4s}
.ocell .inner,.ocell .gp{transition:opacity .8s}
.ocell .d{fill:#8fa9b8;transition:fill .3s}.ocell .d.lit{fill:#fff}
.ocell .l{stroke:var(--line);stroke-width:.8}
.ocell .core{fill:#f2fbff}
.ocell .gp{opacity:0}
.ocell.ghost .mem{stroke-dasharray:4 6;fill:none;opacity:.6}
.ocell.ghost .inner{opacity:0}.ocell.ghost .gp{opacity:1}
.ocell.mixed .mem{stroke-dasharray:4 6}
.ocell.mixed .l,.ocell.mixed .core{opacity:0}.ocell.mixed .gp{opacity:1}
.ocell .lp{opacity:0}.ocell.led .lp{opacity:1}
.ocell .lp circle,.ocell .lp path,.insider circle,.insider path{stroke:var(--amber)}
.ocell .lp line,.insider line{stroke:var(--amber);stroke-width:1;stroke-dasharray:2 3}
.ocell .d.tr{fill:var(--amber)}
.ocell.flag .mem{stroke:var(--rose);stroke-width:4}
.insider{opacity:0;transition:opacity .5s}.mini.hasInsider .insider{opacity:1}
.watch circle{fill:none;stroke:var(--amber);stroke-width:2}
.watch text{fill:var(--amber)}
.logcard{opacity:0;transform:translateY(40px);transition:opacity .5s,transform .6s cubic-bezier(.2,.8,.2,1)}
.logcard.show{opacity:1;transform:none}
.logcard .bg{fill:#081820;stroke:var(--amber);stroke-width:1.6;filter:drop-shadow(0 12px 30px #000c)}
.logcard .lead{stroke:var(--amber);stroke-width:1.4;opacity:.7}
.logcard .hd{font-size:20px;fill:var(--amber);letter-spacing:.04em}
.logcard .live{fill:var(--teal);animation:blink 1.2s infinite}
.lrow{transition:transform .35s ease,opacity .35s}
.lrow>g{animation:rowin .45s ease-out both}
@keyframes rowin{from{opacity:0;transform:translateX(-24px)}}
.lrow .rb{fill:#0f2a35;stroke:#1f4654;stroke-width:1}
.lrow .ar{fill:none;stroke:#8ea5b3;stroke-width:1.6}
.lrow .bar{fill:#2a4a59}
.lrow .to{transition:fill .5s}
.lrow .pz rect{fill:#4a6878;transition:fill .3s}
.lrow .pz circle{fill:none;stroke:var(--amber);stroke-width:1.6;opacity:0;transform-box:fill-box;transform-origin:center}
.lrow.hot .rb{stroke:var(--amber);fill:#2b2416}
.lrow.held .pz rect{fill:var(--amber)}
.lrow.held .pz circle{animation:ripple 1s ease-out 2}
.ocell.hid{opacity:0}.ocell.paused{opacity:.25}
.ocell.wake .mem{stroke-width:4}
.ocell.hot .mem{stroke:var(--amber);stroke-width:4}
.opeople{--c:var(--amber)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="brand"><i></i>Agentic systems</div><button id="fs" aria-label="Full screen" title="Full screen (F)">⛶</button></header>
<main>
<div class="copy" id="copy" aria-live="polite"><p class="chapter" id="chapter"></p><h1 id="title"></h1><p class="body" id="body"></p></div>
<svg id="svg" viewBox="0 0 1000 800" role="img" aria-label="Animated diagram of agentic systems">
<defs>
<radialGradient id="interior"><stop stop-color="#11313d" stop-opacity=".34"/><stop offset=".75" stop-color="#0a1d25" stop-opacity=".16"/><stop offset="1" stop-color="#1ab9ab" stop-opacity=".12"/></radialGradient>
<linearGradient id="spineFade" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0"><stop stop-color="#3c8f96" stop-opacity="0"/><stop offset=".12" stop-color="#3c8f96"/><stop offset=".9" stop-color="#3c8f96"/><stop offset="1" stop-color="#3c8f96" stop-opacity="0"/></linearGradient>
<filter id="edgeBlur" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="14"/></filter>
<mask id="stageMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="800"><rect x="6" y="6" width="988" height="788" fill="#fff" filter="url(#edgeBlur)"/></mask>
<filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<g id="cellScene" class="scene"></g>
<g id="exScene" class="scene"></g>
<g id="orgScene" class="scene" mask="url(#stageMask)"></g>
<g id="fx"></g>
</svg>
</main>
<footer>
<div class="transport"><button id="prev" aria-label="Previous step" title="Previous (←)">‹</button><button id="next" aria-label="Next step" title="Next (→ or Space)">›</button><button id="replay" aria-label="Replay step" title="Replay (R)">↺</button></div>
<nav id="nav" aria-label="Chapters"></nav>
<span class="credit">Diagrams by Claude Fable 5.2 · Nov 11, 2026</span>
</footer>
<script>
"use strict";
/* ---------- tiny engine ---------- */
const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
const el=(tag,attrs={},parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let gen=0;
class Cancel extends Error{}
const sleep=ms=>{const g=gen;return new Promise((res,rej)=>setTimeout(()=>g===gen?res():rej(new Cancel()),reduce?0:ms));};
const tween=(ms,fn)=>{const g=gen;return new Promise((res,rej)=>{if(reduce){fn(1);return res();}const t0=performance.now();const f=now=>{if(g!==gen)return rej(new Cancel());const t=Math.min(1,Math.max(0,(now-t0)/ms));fn(t);t<1?requestAnimationFrame(f):res();};requestAnimationFrame(f);});};
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const bg=p=>{p.catch(()=>{});return p;};
const COL={teal:'#27ddc8',rose:'#f58eab',amber:'#e9bd79',violet:'#a99cff',ink:'#f2fbff',grey:'#8ea5b3'};
const fx=$('fx');
function mover(pos,ms,o={}){const color=o.hex||COL[o.color]||COL.ink,r=o.r||5;
  const g=el('g',{},o.parent||fx);el('circle',{r:r*2.4,fill:color,opacity:.45,filter:'url(#glow)'},g);el('circle',{r,fill:color},g);
  const st=new Map(),put=k=>{const p=pos(k);g.setAttribute('transform',`translate(${p.x},${p.y})`);crossing(p,st);};put(0);
  return tween(ms,t=>put(ease(t))).finally(()=>g.remove());}
const fly=(a,b,o={})=>mover(k=>({x:a.x+(b.x-a.x)*k,y:a.y+(b.y-a.y)*k}),o.ms||520,o);
const showScene=id=>{curScene=id;['cellScene','exScene','orgScene'].forEach(s=>$(s).classList.toggle('show',s===id));};
const pol=(c,deg,r)=>({x:c.x+r*Math.cos(deg*Math.PI/180),y:c.y+r*Math.sin(deg*Math.PI/180)});
const radii=(r,seed,n)=>Array.from({length:n},(_,i)=>r*(1+.06*Math.sin(i*2.3+seed)+.035*Math.cos(i*1.1+seed*2)));
function blob(c,r,seed,n=11){return pathFrom(c,radii(r,seed,n));}
function pathFrom(c,R){const n=R.length,p=R.map((r,i)=>pol(c,i/n*360,r));
  let d=`M${p[0].x.toFixed(1)},${p[0].y.toFixed(1)}`;
  for(let i=0;i<n;i++){const p0=p[(i-1+n)%n],p1=p[i],p2=p[(i+1)%n],p3=p[(i+2)%n];
    d+=`C${(p1.x+(p2.x-p0.x)/6).toFixed(1)},${(p1.y+(p2.y-p0.y)/6).toFixed(1)} ${(p2.x-(p3.x-p1.x)/6).toFixed(1)},${(p2.y-(p3.y-p1.y)/6).toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;}
  return d+'Z';}
/* living membranes: a slow idle wobble, plus a ripple wherever a message crosses */
const MEM=[];let curScene='';
function alive(elm,c,r,seed,n,scene,world=c,rot=0){const R=radii(r,seed,n),m=n*3,B=[];
  for(let j=0;j<m;j++){const u=j/m*n,i=Math.floor(u),f=u-i,g=k=>R[((i+k)%n+n)%n],p0=g(-1),p1=g(0),p2=g(1),p3=g(2);
    B.push(.5*(2*p1+(p2-p0)*f+(2*p0-5*p1+4*p2-p3)*f*f+(3*p1-p0-3*p2+p3)*f*f*f));}
  MEM.push({el:elm,c,r,B,m,seed,scene,world,rot:rot*Math.PI/180,kicks:[],amp:scene==='orgScene'?r*.028:Math.max(3,Math.min(13,r*.07)),idle:scene==='orgScene'?.75:r>200?1:1.8});}
function crossing(p,st){for(const M of MEM){if(M.scene!==curScene)continue;const dx=p.x-M.world.x,dy=p.y-M.world.y,ins=dx*dx+dy*dy<M.r*M.r*.94,was=st.get(M);
  if(was!==undefined&&was!==ins&&M.kicks.length<6)M.kicks.push({ang:Math.atan2(dy,dx)-M.rot,t0:performance.now()/1000,s:ins?-1:1});st.set(M,ins);}}
(function(){if(reduce)return;let odd=0;const TAU=Math.PI*2;
  const tick=now=>{requestAnimationFrame(tick);if(odd^=1)return;const t=now/1000,zoomed=curScene==='orgScene'&&$('orgWorld').style.transform.includes('scale'),zg=zoomed?2.4:1;
    for(const M of MEM){if(M.scene!==curScene)continue;if(M.kicks.length)M.kicks=M.kicks.filter(k=>t-k.t0<2.4);
      const R=M.B.map((b,j)=>{const th=j/M.m*TAU;let v=b*(1+(zoomed?1.8:M.idle)*(.011*Math.sin(2*th+t*.55+M.seed)+.008*Math.sin(3*th-t*.4+M.seed*2.1)));
        for(const k of M.kicks){let d=Math.abs(th-k.ang)%TAU;if(d>Math.PI)d=TAU-d;const q=Math.max(0,t-k.t0);
          v+=k.s*M.amp*zg*(1-Math.exp(-q/.06))*Math.exp(-q/.65)*Math.exp(-((d/1.25)**2))*Math.cos(11*q-4.5*d);}
        return v;});
      M.el.setAttribute('d',pathFrom(M.c,R));}};
  requestAnimationFrame(tick);})();
function personGlyph(parent,x,y,s=1){const g=el('g',{class:'person',transform:`translate(${x},${y}) scale(${s})`},parent);el('circle',{cy:-9,r:7},g);el('path',{d:'M-13,14c0-9 6-13 13-13s13,4 13,13'},g);return g;}

/* ---------- scene 1: the cell ---------- */
const cell=$('cellScene'),C={x:500,y:400},N={};
const L={};['today','body','req','ctx','tool','arch','db'].forEach(k=>L[k]=el('g',{class:'layer',id:'L-'+k},cell));
// order: today, body (membrane, edges, nodes), then extras
(function buildToday(){L.today.classList.add('today');
  [[330,190],[640,150],[800,330],[720,560],[420,620],[270,410],[530,380]].forEach(([x,y],i)=>{
    personGlyph(L.today,x,y,1.25);el('circle',{class:'agent',cx:x+62,cy:y,r:6},L.today);
    el('circle',{class:'ping',cx:x+22,cy:y,r:3,style:`animation-delay:${-i*.37}s`},L.today);});})();
const bodyG=el('g',{class:'breathe'},L.body);
const membrane=el('path',{class:'membrane',d:blob(C,352,1.7),pathLength:1},bodyG);alive(membrane,C,352,1.7,11,'cellScene');
const edgesG=el('g',{},bodyG),nodesG=el('g',{},bodyG),filesG=el('g',{},bodyG);
function mkEdge(a,b,parent){return el('line',{class:'edge',x1:N[a].x,y1:N[a].y,x2:N[b].x,y2:N[b].y,'data-e':a+'-'+b},parent);}
function mkNode(id,parent,r,cls=''){const n=N[id],g=el('g',{class:'node '+cls,transform:`translate(${n.x},${n.y})`},parent);
  el('circle',{class:'halo',r:r*3,filter:'url(#glow)'},g);el('circle',{class:'core',r},g);n.el=g;n.parts=[g];return g;}
function team(id,deg,rad,label,eParent,nParent,n=4,leafR=82){
  const h=pol(C,deg,rad);N[id]={x:h.x,y:h.y};const ids=[];
  for(let i=0;i<n;i++){const p=pol(h,deg+(i-(n-1)/2)*38,i%2?leafR:leafR-16);N[id+i]={x:p.x,y:p.y};ids.push(id+i);}
  const kid=pol(N[id+1],deg+20,38);N[id+'k']={x:kid.x,y:kid.y};
  const es=[mkEdge('dir',id,eParent),...ids.map(l=>mkEdge(id,l,eParent)),mkEdge(id+1,id+'k',eParent)];

/* ---------- presenter ---------- */
let cur=0;
const firstOf=c=>STEPS.findIndex(s=>s.ch===c);
const nav=$('nav');
CH.forEach((c,i)=>{const b=document.createElement('button');b.innerHTML=`<span>${i+1} · ${c.name}</span><div class="dots">${STEPS.filter(s=>s.ch===i).map(()=>'<i></i>').join('')}</div>`;b.onclick=()=>go(firstOf(i));nav.appendChild(b);});
function paintNav(){const c=STEPS[cur].ch,k=cur-firstOf(c);[...nav.children].forEach((b,i)=>{b.setAttribute('aria-current',i===c);[...b.querySelectorAll('i')].forEach((d,j)=>{d.className=i<c||(i===c&&j<k)?'done':(i===c&&j===k?'now':'');});});}
function go(i,opts={}){i=Math.max(0,Math.min(STEPS.length-1,i));const changed=i!==cur||opts.force;cur=i;gen++;fx.innerHTML='';orgFx.innerHTML='';
  const s=STEPS[i],c=CH[s.ch],k=i-firstOf(s.ch),n=STEPS.filter(x=>x.ch===s.ch).length;
  const copy=$('copy');
  const write=()=>{$('chapter').textContent=`${s.ch+1} · ${c.name}  ·  ${k+1} / ${n}`;$('title').textContent=s.title;$('body').textContent=s.body;copy.classList.remove('swap');};
  if(changed&&!reduce&&!opts.first){copy.classList.add('swap');setTimeout(write,220);}else write();
  paintNav();document.title=`${c.name} — Agentic systems`;
  const h=`#${c.id}~${k+1}`;if(location.hash!==h)history.replaceState(null,'',h);
  s.setup();bg(Promise.resolve().then(()=>s.play()));}
function fromHash(){const m=location.hash.match(/^#([a-z]+)(?:~(\d+))?/);if(!m)return 0;const c=CH.findIndex(x=>x.id===m[1]);if(c<0)return 0;
  const n=STEPS.filter(x=>x.ch===c).length;return firstOf(c)+Math.max(0,Math.min(n-1,(+m[2]||1)-1));}
$('next').onclick=()=>go(cur+1);$('prev').onclick=()=>go(cur-1);$('replay').onclick=()=>go(cur,{force:1});
const fs=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();
$('fs').onclick=fs;
addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;const onBtn=e.target.closest&&e.target.closest('button');
  if(e.key==='ArrowRight'||e.key==='PageDown'||(e.key===' '&&!onBtn)){e.preventDefault();go(cur+1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(cur-1);}
  else if(e.key==='r'||e.key==='R')go(cur,{force:1});
  else if(e.key==='Home')go(firstOf(STEPS[cur].ch));
  else if(e.key==='f'||e.key==='F')fs();});
addEventListener('hashchange',()=>{const i=fromHash();if(i!==cur)go(i);});
cur=fromHash();go(cur,{first:1});
