<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" role="img"><title>A role, an agent and a record are different things</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526679"/></marker></defs><rect width="100%" height="100%" fill="#f5f8fc"/><rect x="30" y="60" width="280" height="165" rx="14" fill="white" stroke="#2463c7" stroke-width="2"/><rect x="30" y="77" width="5" height="131" rx="2" fill="#2463c7"/><text x="170.0" y="92" font-family="Arial,sans-serif" font-size="21" font-weight="600" text-anchor="middle" fill="#16324a">Role definition</text><text x="170.0" y="125" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#526679">Written responsibility</text><text x="170.0" y="147" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#526679">Knowledge and constraints</text><text x="170.0" y="169" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#526679">Persists between tasks</text><rect x="360" y="60" width="280" height="165" rx="14" fill="white" stroke="#087b78" stroke-width="2"/><rect x="360" y="77" width="5" height="131" rx="2" fill="#087b78"/><text x="500.0" y="92" font-family="Arial,sans-serif" font-size="21" font-weight="600" text-anchor="middle" fill="#16324a">Agent instance</text><text x="500.0" y="125" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#526679">Actual execution handle</text><text x="500.0" y="147" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#526679">Dispatched and supervised</text><text x="500.0" y="169" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#526679">Can stop or be replaced</text><rect x="690" y="60" width="280" height="165" rx="14" fill="white" stroke="#526679" stroke-width="2"/><rect x="690" y="77" width="5" height="131" rx="2" fill="#526679"/><text x="830.0" y="92" font-family="Arial,sans-serif" font-size="21" font-weight="600" text-anchor="middle" fill="#16324a">Durable record</text><text x="830.0" y="125" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#526679">Exact sources and decisions</text><text x="830.0" y="147" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#526679">Current commitments</text><text x="830.0" y="169" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#526679">Survives the actor</text></svg>