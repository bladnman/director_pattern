<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Eight proposed action cards and their triggers</title><desc id="desc">Eight cards pair a responsibility with the action that is supposed to trigger a complete read.</desc>
<defs><style>text{font-family:system-ui,sans-serif;fill:#20252b}.muted{fill:#596572}.head{font-size:23px;font-weight:750}.body{font-size:17px}.num{font-size:18px;font-weight:800;fill:#315b99}.card{fill:#fff;stroke:#d7d2c8;stroke-width:2}.top{fill:#e8eef8;stroke:#315b99;stroke-width:1.5}</style></defs><rect width="1200" height="720" fill="#f4f2ed"/><text x="40" y="52" font-size="30" font-weight="800">Eight cards: open the file before the named work</text>
<g transform="translate(40,88)">
<g><rect class="card" width="540" height="130" rx="16"/><rect class="top" x="18" y="18" width="48" height="42" rx="12"/><text class="num" x="42" y="46" text-anchor="middle">01</text><text class="head" x="82" y="43">Badge · check and 🎬</text><text class="body muted" x="82" y="77">After a failed check, or when changing instruction loading.</text><text class="body muted" x="82" y="103">Meaning, gaps and retry conditions.</text></g>
<g transform="translate(580,0)"><rect class="card" width="540" height="130" rx="16"/><rect class="top" x="18" y="18" width="48" height="42" rx="12"/><text class="num" x="42" y="46" text-anchor="middle">02</text><text class="head" x="82" y="43">Recovery · held work</text><text class="body muted" x="82" y="77">Director's first project action after compaction or resume.</text><text class="body muted" x="82" y="103">Find, reconcile and resume unfinished work.</text></g>
<g transform="translate(0,148)"><rect class="card" width="540" height="130" rx="16"/><rect class="top" x="18" y="18" width="48" height="42" rx="12"/><text class="num" x="42" y="46" text-anchor="middle">03</text><text class="head" x="82" y="43">Requests · capture and steer</text><text class="body muted" x="82" y="77">Before capture, split, steering, or any store command.</text><text class="body muted" x="82" y="103">Partner judgment, lifecycle and state work.</text></g>
<g transform="translate(580,148)"><rect class="card" width="540" height="130" rx="16"/><rect class="top" x="18" y="18" width="48" height="42" rx="12"/><text class="num" x="42" y="46" text-anchor="middle">04</text><text class="head" x="82" y="43">Staffing · assign work</text><text class="body muted" x="82" y="77">Before staffing, briefing, or setting tier and effort.</text><text class="body muted" x="82" y="103">Role, scope, authority and checks.</text></g>
<g transform="translate(0,296)"><rect class="card" width="540" height="130" rx="16"/><rect class="top" x="18" y="18" width="48" height="42" rx="12"/><text class="num" x="42" y="46" text-anchor="middle">05</text><text class="head" x="82" y="43">Supervision · evaluate work</text><text class="body muted" x="82" y="77">While supervising, reviewing a return, or ending with work out.</text><text class="body muted" x="82" y="103">SitReps, result-level checks and exits.</text></g>
<g transform="translate(580,296)"><rect class="card" width="540" height="130" rx="16"/><rect class="top" x="18" y="18" width="48" height="42" rx="12"/><text class="num" x="42" y="46" text-anchor="middle">06</text><text class="head" x="82" y="43">Knowledge · learn and maintain</text><text class="body muted" x="82" y="77">For task knowledge, a correction, or outcome closure.</text><text class="body muted" x="82" y="103">Selectors, durable rules and upkeep.</text></g>
<g transform="translate(0,444)"><rect class="card" width="540" height="130" rx="16"/><rect class="top" x="18" y="18" width="48" height="42" rx="12"/><text class="num" x="42" y="46" text-anchor="middle">07</text><text class="head" x="82" y="43">Update check · update authority</text><text class="body muted" x="82" y="77">When last check is older than 24h, or during update discussion.</text><text class="body muted" x="82" y="103">Discovery, preferences, who may update.</text></g>
<g transform="translate(580,444)"><rect class="card" width="540" height="130" rx="16"/><rect class="top" x="18" y="18" width="48" height="42" rx="12"/><text class="num" x="42" y="46" text-anchor="middle">08</text><text class="head" x="82" y="43">Privacy · exact sources</text><text class="body muted" x="82" y="77">Before first exact-source capture or changing Git tracking.</text><text class="body muted" x="82" y="103">Visibility, warnings and ignore choices.</text></g>
</g></svg>
