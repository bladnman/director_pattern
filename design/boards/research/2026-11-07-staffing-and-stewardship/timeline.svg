<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d">
<title id="t">Session timeline around the compaction</title>
<desc id="d">Five workers inherit before an idle auto-compaction at 00:04 UTC; afterwards the role text is gone, 18 more checked-Director markers follow without a re-check, and nine outside workers are dispatched.</desc>
<style>
:root{--surface:#ffffff;--ink:#1c2229;--muted:#5a6470;--line:#d6d0c4;--accent:#2f5fa8;--inherit:#b8492f;--chosen:#2c7a66;--neutral:#8a93a0;--warn-bg:#fbebe5;--ok-bg:#e4f2ec;--mid-bg:#f6efd9;--on-accent:#ffffff}
@media (prefers-color-scheme: dark){:root{--surface:#1c2027;--ink:#e8eaee;--muted:#a3abb7;--line:#3a414c;--accent:#79a6f0;--inherit:#ec8569;--chosen:#5fc3a8;--neutral:#8c95a3;--warn-bg:#40261f;--ok-bg:#1c372f;--mid-bg:#3a331d;--on-accent:#10141a}}

svg text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.d-bg{fill:var(--surface)}
.d-ink{fill:var(--ink)}
.d-muted{fill:var(--muted)}
.d-axis{stroke:var(--muted)}
.d-inh{fill:var(--inherit)}
.d-inh-ring{fill:none;stroke:var(--inherit);stroke-width:2.5}
.d-cho{fill:var(--chosen)}
.d-neu{fill:var(--neutral)}
.d-ctx{fill:var(--accent)}
.d-ctx-soft{fill:var(--accent);fill-opacity:.2}
.d-onctx{fill:var(--on-accent)}
.d-cut{stroke:var(--inherit)}
.d-num{fill:var(--ink)}
.d-onnum{fill:var(--surface)}
.d-box{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.d-okbox{fill:var(--ok-bg);stroke:var(--chosen);stroke-width:1.5}
.d-midbox{fill:var(--mid-bg);stroke:var(--neutral);stroke-width:1.5}
.d-warnbox{fill:var(--warn-bg);stroke:var(--inherit);stroke-width:2}
.d-arrow{stroke:var(--accent)}
.d-arrowhead{fill:var(--accent)}
</style>
